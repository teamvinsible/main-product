name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Guard — Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable deploys."
            exit 1
          fi
      - run: npm ci
      - name: Typecheck + test API
        run: |
          npm run typecheck -w @teamvinsible/api
          npm test -w @teamvinsible/api
      - name: Deploy API Worker (with containers)
        run: npm run deploy -w @teamvinsible/api
      # Repository secrets are the single source of truth for Worker secrets.
      # SUPABASE_URL reuses VITE_SUPABASE_URL (same value, public anyway).
      - name: Sync Worker secrets from repository secrets
        working-directory: apps/api
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
        run: |
          node -e '
            const keys = ["SUPABASE_URL","SUPABASE_JWT_SECRET","SUPABASE_SERVICE_ROLE_KEY","DEEPSEEK_API_KEY","GITHUB_CLIENT_ID","GITHUB_CLIENT_SECRET"];
            const out = {};
            for (const k of keys) if (process.env[k]) out[k] = process.env[k];
            const missing = keys.filter((k) => !process.env[k]);
            if (missing.length) console.log("::warning::Missing repo secrets (Worker features degraded): " + missing.join(", "));
            require("fs").writeFileSync("secrets.json", JSON.stringify(out));
            console.log("Syncing " + Object.keys(out).length + " secret(s) to the Worker");
          '
          if [ "$(node -p 'Object.keys(require("./secrets.json")).length')" != "0" ]; then
            npx wrangler secret bulk secrets.json
          fi
          rm -f secrets.json
      - name: Apply D1 migrations
        working-directory: apps/api
        run: npx wrangler d1 migrations apply teamvinsible --remote
      - name: Build web (live mode)
        run: npm run build -w @teamvinsible/web
        env:
          VITE_USE_MOCK: "false"
          VITE_API_ORIGIN: https://api.teamvinsible.com
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
      - name: Deploy web to Pages
        run: npx wrangler pages deploy apps/web/dist --project-name teamvinsible-web --branch main
